name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q
      - name: Run evidence-grounded offline retrieval demo
        run: python -m scripts.run_secure_demo > retrieval-evidence.json
      - name: Preserve retrieval and provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-quality-evidence
          path: retrieval-evidence.json
          retention-days: 7
