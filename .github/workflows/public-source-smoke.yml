name: Real public source smoke (bounded)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_source_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch a bounded public dataset sample
        run: |
          python -m scripts.fetch_research_catalogues --sources openalex --page-size 5 --max-pages 1 --out public-smoke
      - name: Retain real-source sample and provenance
        uses: actions/upload-artifact@v4
        with:
          name: openalex-official-metadata-sample
          path: public-smoke/**
          retention-days: 7
